[channel]
kind = "wecom" # 可选: "wecom" 企业微信内部群, "wx_cli" 普通微信/外部群本地通道

[wecom]
bot_id = "your-bot-id"
secret = "your-secret"

[ai]
api_key = "your-api-key"
api_url = "https://api.openai.com/v1/chat/completions"
model = "gpt-4o-mini"
provider = "open_ai"                                   # 可选: "open_ai", "hermes"
system_prompt = "你是一个有用的助手，用中文回复。"

[hermes]
agent_id = "your-hermes-agent-id"
api_key = "your-hermes-api-key"
api_url = "http://127.0.0.1:8000/v1/chat"
timeout_secs = 60

[wx_cli]
bin = "wx"
group_chat_id = ""                                              # wx-cli 输出不包含 chat_id 时的兜底群 ID
poll_args = ["new-messages", "--json"]                          # 按本地 wx-cli/插件实际命令调整
poll_interval_secs = 5
send_args = ["send", "--chat", "{chat_id}", "--text", "{text}"]

[bot]
context_messages = 8 # 每次回复前纳入最近多少条同会话文本作为上下文；0 表示只使用当前消息
mention_names = []   # wx-cli 群机器人建议配置为 ["@AI助手"]；留空则回复所有文本消息

[schedule]
daily_report_chat_id = ""                    # 目标群的 chat_id
daily_report_cron = "0 0 1 * * *"
daily_report_lookback_hours = 24             # 日报读取最近多少小时的已保存群消息
daily_report_max_links = 20                  # 日报最多纳入多少条去重链接
daily_report_max_messages = 200              # 日报最多纳入多少条消息
daily_report_prompt = "请根据今天的对话生成一份简洁的日报摘要。"

[[schedule.daily_reports]]
chat_id = "group-chat-id-1"
cron = "0 0 1 * * *"
enabled = true
lookback_hours = 24
max_links = 20
max_messages = 200
name = "技术群日报"
prompt = "请根据今天的技术群对话生成一份简洁日报，优先提炼 Rust、AI、Web3 和 ZKP 相关信息。"

[[schedule.daily_reports]]
chat_id = "group-chat-id-2"
enabled = false
name = "投研群日报"

# 微信公众号 RSS 日报 (需要 moonpub 已配置；目标群为空时可回退到 wechat_rss/public_sources)
# [[schedule.daily_reports]]
# chat_id = ""
# cron = "0 0 0 * * *"
# daily_quote = ""   # 可选: 日报底部每日一句
# enabled = true
# name = "微信公众号日报"
# output = "wechat"
# wechat_articles_dir = "/data/moonpub"   # moonpub 的 articles 根目录
# wechat_bin = "moonpub"

[storage]
database_url = "postgres://postgres:postgres@localhost:5432/qunmind"

[public_sources]
arxiv_enabled = false
arxiv_max_items = 15
arxiv_timeout_secs = 15
arxiv_url = "https://export.arxiv.org/api/query?search_query=cat:cs.LG+OR+cat:cs.AI+OR+cat:cs.CL&sortBy=submittedDate&sortOrder=descending"
coingecko_enabled = false
coingecko_max_items = 8
coingecko_timeout_secs = 10
coingecko_trending_url = "https://api.coingecko.com/api/v3/search/trending"
coinmarketcap_enabled = false
coinmarketcap_max_items = 8
coinmarketcap_timeout_secs = 10
coinmarketcap_top_stories_url = "https://coinmarketcap.com/top-stories/"
defillama_enabled = false
defillama_max_items = 8
defillama_protocols_url = "https://api.llama.fi/protocols"
defillama_timeout_secs = 10
dune_api_base_url = "https://api.dune.com/api/v1"
dune_api_key = ""
dune_enabled = false
dune_max_rows_per_query = 5
dune_query_ids = []
dune_timeout_secs = 10
ethresear_enabled = false
ethresear_max_items = 10
ethresear_timeout_secs = 10
ethresear_url = "https://ethresear.ch"
github_trending_base_url = "https://github.com/trending"
github_trending_enabled = false
github_trending_languages = ["rust", "go", "python", "typescript"]
github_trending_max_items = 8
github_trending_since = "daily"
github_trending_timeout_secs = 10
hacker_news_base_url = "https://hacker-news.firebaseio.com/v0"
hacker_news_enabled = false
hacker_news_max_items = 10
hacker_news_timeout_secs = 10
hn_daily_enabled = false
hn_daily_max_items = 20
hn_daily_timeout_secs = 10
hn_daily_url = "https://www.daemonology.net/hn-daily/"
max_items = 12
slerf_blog_enabled = false
slerf_blog_max_items = 8
slerf_blog_timeout_secs = 10
slerf_blog_urls = ["https://blog.slerf.tools/"]
topic_keywords = [
  "rust",
  "wasm",
  "webassembly",
  "web3",
  "crypto",
  "blockchain",
  "ethereum",
  "solana",
  "ai",
  "llm",
  "agent",
  "zk",
  "zkp",
  "zero knowledge",
  "zero-knowledge",
]
web3_media_enabled = false
web3_media_max_items = 10
web3_media_timeout_secs = 15
web3_media_urls = [
  "https://cryptoslate.com/feed/",
  "https://decrypt.co/feed",
  "https://cointelegraph.com/rss",
  "https://www.panewslab.com/rss.xml?lang=zh&type=NEWS",
  "https://www.wublock123.com/feed",
]
wechat_rss_enabled = true
wechat_rss_max_items = 10
wechat_rss_timeout_secs = 10
wechat_rss_urls = [
  "http://127.0.0.1:8080/rss.xml",
] # 可对接 wechat-download-api / Horizon 一类上游 RSS 输出；适合公众号日报空群回退或手工日报联调

# 命名公众号源目录：用于 `qunmind wechat-articles --account-name ...`。
# QunMind 只消费已绑定的 RSS / Atom / API 上游，不在主进程内按公众号名硬爬微信历史文章。
# [[public_sources.wechat_accounts]]
# aliases = ["xunyue", "寻月"]
# feed_url = "http://127.0.0.1:8080/xunyue/rss.xml"
# name = "寻月隐君"

# 单篇公众号文章 helper：适合“给一个 mp.weixin.qq.com/s/... 链接，最佳努力转 markdown + 下载图片”。
# 这是显式调用的外部 helper，不属于 RSS 长期订阅主路径。
wechat_article_helper_bin = ""
wechat_article_helper_output_dir = "/tmp/qunmind-wechat-article-helper"

x_rss_enabled = false
x_rss_max_items = 20
x_rss_timeout_secs = 10
x_rss_urls = [
  # "https://rsshub.example/x/user/openai",
  # "https://nitter.example/a16zcrypto/rss",
] # X/Twitter 一手信息入口；只消费 RSS / Atom 上游，不在 QunMind 主进程内做登录抓取或反风控

official_blogs_enabled = false
official_blogs_max_items = 12
official_blogs_timeout_secs = 15
official_blogs_urls = [
  "https://openai.com/news/rss.xml",
  "https://blog.google/innovation-and-ai/technology/ai/rss/",
  "https://blog.cloudflare.com/rss/",
] # 官网 / 官方博客一手来源；适合补 OpenAI、Google、Cloudflare 这类更高层面的正式发布与技术博客

reddit_rss_enabled = false
reddit_rss_max_items = 16
reddit_rss_timeout_secs = 15
reddit_rss_urls = [
  "https://www.reddit.com/r/rust/.rss",
  "https://www.reddit.com/r/MachineLearning/.rss",
  "https://www.reddit.com/r/ethdev/.rss",
  "https://www.reddit.com/r/cryptography/.rss",
] # Reddit 社区讨论入口；只消费公开 RSS，用来补充 AI / Web3 / 开源的实用问题、工具反馈和工程讨论

# 手工精选入口：适合临时补入你明确想推荐大家阅读的一手原文、X 原帖或官方文章。
# 这些条目会进入日报素材池，优先出现在“推荐深读”或“完整素材链接”里。
[[public_sources.manual_items]]
author = "OpenAI"
category = "ai"
score = 1000
source = "OpenAI"
summary = "OpenAI 官方文章，适合作为 AI Agent 编排和 Codex 开源工作流方向的推荐深读。"
title = "Open-source Codex orchestration symphony"
url = "https://openai.com/zh-Hans-CN/index/open-source-codex-orchestration-symphony/"

