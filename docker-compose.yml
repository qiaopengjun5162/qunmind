services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qunmind
      POSTGRES_USER: qunmind
      POSTGRES_PASSWORD: qunmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qunmind -d qunmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qunmind:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/qiaopengjun5162/qunmind:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config.toml:/app/config.toml:ro

volumes:
  postgres-data:
