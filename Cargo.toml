[package]
description = "Rust WeChat group AI mind backend with WeCom, wx-cli, OpenAI-compatible, and Hermes adapters."
edition = "2024"
license = "MIT"
name = "qunmind"
version = "0.1.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cron = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "postgres",
  "runtime-tokio",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wecom-aibot-rust-sdk = "1.0"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.profiling]
debug = "full"
inherits = "release"
strip = false
